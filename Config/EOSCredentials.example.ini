+Artifacts=(ArtifactName="CrazyArcade3DServer",ClientId="<데디 서버 Client ID>",ClientSecret="<데디 서버 Client Secret>",ProductId="<Product ID>",SandboxId="<Sandbox ID>",DeploymentId="<Deployment ID>",EncryptionKey="")
