; ─────────────────────────────────────────────────────────────────────────────
; EOS 자격 증명 **템플릿**. 이 파일만 git 에 올라간다.
;
; 새 머신에서 할 일:
;   1. 이 파일을 같은 폴더에 `EOSCredentials.ini` 로 복사한다 (그 이름은 .gitignore 대상)
;   2. 아래 <> 자리를 https://dev.epicgames.com/portal 에서 발급받은 값으로 채운다
;
; 값 위치 (Product Settings):
;   ProductId    → 제품 개요
;   SandboxId    → Sandboxes (개발 중에는 Dev 샌드박스)
;   DeploymentId → Deployments (해당 샌드박스의 것)
;   ClientId/Secret → Clients (클라이언트별로 다르다)
;
; 클라이언트는 2개를 만든다 — 정책(Client Policy)을 먼저 만들어야 선택할 수 있다:
;   · 게임 클라 : 정책 타입 Peer2Peer
;   · 데디 서버 : 정책 타입 Dedicated Server (Trusted Server 는 게임 서버가 아니라
;                 별도로 운영하는 백엔드 웹 서비스용이다 — 권한이 필요 이상으로 넓다)
; ─────────────────────────────────────────────────────────────────────────────

[/Script/OnlineSubsystemEOS.EOSSettings]
DefaultArtifactName=CrazyArcade3D

+Artifacts=(ArtifactName="CrazyArcade3D",ClientId="<게임 클라 Client ID>",ClientSecret="<게임 클라 Client Secret>",ProductId="<Product ID>",SandboxId="<Sandbox ID>",DeploymentId="<Deployment ID>",EncryptionKey="")

