; ─────────────────────────────────────────────────────────────────────────────
; ⚠️ 보류 상태 (2026-08-02) — DefaultPlatformService 를 EOS 가 아니라 NULL 로 둔다.
;    EOS 로 두면 엔진이 시작 시점에 EOS 플랫폼을 만들어 로그인 경로가 살아난다.
;    지금은 로비를 배포 시점까지 미뤘으므로(사용자 결정) 아예 만들지 않는다.
;    다시 켤 때: 여기를 EOS 로 바꾸고 DefaultGame.ini 의 bEnableEOS=true.
;    단 그 전에 엔진 쪽 Device ID 블로커가 해결돼야 한다 (mds/Tasks/19 "보류 상태" 절).
[OnlineSubsystem]
